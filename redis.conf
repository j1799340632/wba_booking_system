# Allow access from all IPs
bind 0.0.0.0
# Set access password
# Docker Compose supplies the password through REDIS_PASSWORD.

# Enable key expiration monitoring (E: Keyevent events, x: Expired events)
notify-keyspace-events Ex
# Enable multi-threaded I/O (assuming 4 threads are allocated)
io-threads 4
# Make read operations also use I/O multithreading
io-threads-do-reads yes

# Limit maximum memory usage
maxmemory 1024mb
# When memory reaches its limit, the LRU algorithm is used to evict the least recently used key
maxmemory-policy allkeys-lru
# Disable/Rename Destructive Commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""