--- # server
server:
  port: 8080
  http2:
    enabled: true
  shutdown: graceful

--- # spring
spring:
  application:
    name: unsw-WBA-backend
  profiles:
    include: db,custom,calendar
  servlet:
    multipart:
      max-file-size: 5MB
  output:
    ansi:
      enabled: always
  jackson:
    time-zone: GMT+10
    date-format: yyyy-MM-dd HH:mm:ss
  threads:
    virtual:
      enabled: true

--- # Log
wba:
  booking:
    time-zone: Australia/Sydney
    ai:
      enabled: ${BOOKING_AI_ENABLED:false}
      endpoint: ${BOOKING_AI_ENDPOINT:https://api.deepseek.com/chat/completions}
      model: ${BOOKING_AI_MODEL:deepseek-flash}
      api-key: ${BOOKING_AI_API_KEY:}
      timeout-seconds: ${BOOKING_AI_TIMEOUT_SECONDS:20}
      disable-thinking: ${BOOKING_AI_DISABLE_THINKING:true}

logging:
  level:
    edu.unsw: ${LOGGING_LEVEL:debug}
