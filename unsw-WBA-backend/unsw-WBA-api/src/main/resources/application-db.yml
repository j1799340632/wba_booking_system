spring:
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unsw_wba?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Australia/Sydney&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true}
    username: ${SPRING_DATASOURCE_USERNAME:UNSWWBA}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # The minimum number of connections allowed in the connection pool. Default value: 10
      minimum-idle: 30
      # The maximum number of connections allowed in the connection pool. Default value: 10
      maximum-pool-size: 30
      # Auto commit
      auto-commit: true
      # The maximum duration (in milliseconds) for a connection to be in an idle state; it will be released (retired) after this timeout. Default: 10 minutes
      idle-timeout: 600000
      # Pool name
      pool-name: MyHikariCP
      # The lifetime of a connection (in milliseconds) is determined by the connection being released if it times out and is not used. The default is 30 minutes; it is recommended to set it to 30 seconds less than the database timeout
      max-lifetime: 1800000
      # Maximum time (in milliseconds) to wait for a connection to be allocated by the connection pool. If no connection is available after this time, an SQLException will occur. Default: 30 seconds
      connection-timeout: 30000
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # Global logic delete field name
      logic-delete-field: isDelete
      # Deleted value
      logic-not-delete-value: 0
      # Not deleted value
      logic-delete-value: 1
  configuration:
    return-instance-for-empty-row: true
    # Print the SQL statement (this should be disabled in a production environment)
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
