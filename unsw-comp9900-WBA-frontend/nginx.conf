# Hide Nginx version number
server_tokens off;

# Gzip
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

server {
    listen 80;
    server_name localhost;

    # The X-Frame-Options HTTP response header can instruct the browser whether to allow the current webpage to be displayed in a "frame" or "iframe" tag, thereby preventing website content from being referenced by other sites and protecting it from clickjacking attacks
    add_header X-Frame-Options SAMEORIGIN;
    # This instructs the browser to block HTTP requests to prevent man-in-the-middle attacks. The parameter specifies the expiration time: for the next year (31,536,000 seconds), whenever a user clicks a hyperlink or enters http://www.example.com/ in the address bar, the browser should automatically rewrite the HTTP request as HTTPS and then send a request directly to https://www.example.com/. The server's TLS certificate is invalid; users should not ignore the browser warning and continue accessing the website
    add_header Strict-Transport-Security "max-age=31536000";
    # To defend against XSS (Cross-Site Scripting) and data injection attacks, care must be taken not to affect the front-end framework itself or allow external libraries
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:;";

    # Front-end static pages
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Solving the 404 refresh issue in React Router single-page applications
        try_files $uri $uri/ /index.html;
    }

    # Proxy SSE
    location /api/general/sse/subscribe/ {
        proxy_pass http://backend:8080/general/sse/subscribe/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # For SSE (Server-Sent Events) or WebSocket, these two lines need to be added to prevent Nginx buffering from causing message delays
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;

        # If you don't have a heartbeat, you can appropriately increase the SSE timeout to prevent Nginx from disconnecting automatically
        # proxy_read_timeout 3600s;
    }

    # Proxy and path rewriting in vite.config.js
    location /api/ {
        # Note the forward slash "/" after `backend:8080`. In Nginx, this effectively removes the matched "/api/" prefix
        proxy_pass http://backend:8080/;

        # Retain the client's real IP address for the backend to obtain
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Files uploaded from the managed backend (zero-copy technology)
    location /file/ {
        # Points to the directory mounted inside the Nginx container
        alias /usr/share/nginx/html/file/;

        # Zero Copy
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Browser caching optimization (force caching for 30 days)
        expires 30d;
        access_log off;
    }
}